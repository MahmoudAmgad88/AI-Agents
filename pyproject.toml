#Makes your application an installable Python package
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent101-procurement"
version = "0.1.0"
description = "A CrewAI procurement assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai==1.15.33",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[project.scripts]
agent101 = "agent101.cli:main"